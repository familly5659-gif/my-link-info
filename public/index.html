<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f8f3"><title>모아 — 취향이 모이는 곳</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<main class="link-page">
<h1 class="sr-only">모아 상품 링크</h1>
<header class="search-bar">
  <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="상품을 검색해 보세요" aria-label="상품 검색" autocomplete="off"></label>
  <button id="share" class="icon-button" aria-label="이 페이지 공유하기" title="이 페이지 공유하기">↗</button>
</header>
<section class="collection" aria-label="상품 목록">
  <div class="list-heading"><p><span id="collection-label">전체 상품</span> <span id="count">0</span></p><button id="add" class="primary" hidden>＋ 링크 추가</button></div>
  <p id="demo-notice" class="demo-notice" hidden>예시 상품입니다. 관리자 로그인 후 내 상품을 추가해 보세요.</p>
  <div id="cards" class="product-list" aria-live="polite"></div>
  <p id="empty" class="empty" hidden>검색 결과가 없어요. 다른 단어로 찾아보세요.</p>
</section>
<aside class="disclosure">이 페이지에는 제휴 링크가 포함될 수 있으며,<br>구매 시 일정액의 수수료를 제공받을 수 있습니다.</aside>
<footer><a class="wordmark" href="/" aria-label="모아 홈">moa<span>모아</span></a><div><button id="manage" class="quiet">관리자 로그인</button><button id="logout" class="quiet" hidden>로그아웃</button></div></footer>
</main>
<dialog id="login-dialog"><form id="login-form"><div class="dialog-head"><h2>내 보관함 관리</h2><button type="button" class="close" data-close>×</button></div><p class="help">서버에 보관된 관리자 키로 로그인하세요.</p><label>관리자 키<input name="key" type="password" required autocomplete="current-password"></label><p class="form-error" role="alert"></p><button class="primary full">로그인</button></form></dialog>
<dialog id="editor"><form id="link-form"><div class="dialog-head"><h2 id="editor-title">새로운 발견 추가</h2><button type="button" class="close" data-close>×</button></div><label>상품 또는 Threads 링크 <span>*</span><input name="url" type="url" required placeholder="https://link.coupang.com/…"></label><button type="button" id="fetch-meta" class="secondary full">↗ 링크에서 상품 정보 가져오기</button><p id="meta-status" class="help" aria-live="polite">쿠팡·토스쇼핑·Threads 링크를 지원해요. 가져온 정보는 수정할 수 있어요.</p><label>상품 이름 <span>*</span><input name="title" required maxlength="160" placeholder="어떤 아이템인가요?"></label><label>나의 한 줄 추천<textarea name="summary" maxlength="1000" rows="3" placeholder="좋았던 점을 내 말로 남겨주세요."></textarea></label><label>썸네일 이미지 주소<input name="image" type="url" placeholder="https://… (선택)"></label><label>카테고리<select name="category"><option>살림·주방</option><option>디지털</option><option>패션·뷰티</option><option>라이프</option></select></label><p class="form-error" role="alert"></p><button id="save-link" class="primary full">내 보관함에 저장</button></form></dialog>
<div id="toast" role="status" hidden></div>
</body></html>
